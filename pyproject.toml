[project]
name = "split-models"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "transformers>=4.30",
  "safetensors>=0.4",
  "huggingface-hub>=0.23",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
