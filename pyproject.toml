[project]
name = "split-models"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "transformers>=4.30",
  "safetensors>=0.4",
  "huggingface-hub>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.scripts]
split-lm = "split_lm.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["split_lm*", "experiments*", "tools*"]
exclude = ["tests*"]
