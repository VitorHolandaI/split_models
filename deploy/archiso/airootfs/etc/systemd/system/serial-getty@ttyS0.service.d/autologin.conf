[Service]
# O harness de VM expõe o console pela serial (-serial mon:stdio), entao o
# login automatico so do tty1 deixava a VM presa no prompt do serial-getty.
# Mesmo conteudo do getty@tty1.service.d, com o baud da console= do boot.
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I 115200 $TERM
