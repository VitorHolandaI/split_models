# Acesso root por chave, para desligar e inspecionar os nos sem ir ate cada
# maquina fisicamente.
#
# Este arquivo tem que continuar sendo o de menor prefixo em sshd_config.d:
# sshd usa o PRIMEIRO valor obtido de cada palavra-chave (man 5 sshd_config) e o
# Include esta na linha 2 do sshd_config. Um 20-*.conf seria lido depois e
# perderia para o que estiver aqui.
#
# Autenticacao por senha fica desligada de proposito. A conta root da imagem tem
# senha vazia (/etc/shadow), entao liberar senha aqui equivaleria a entregar root
# a qualquer host da LAN sem credencial nenhuma. O login automatico em tty1
# continua sendo a saida se a chave estiver errada.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
